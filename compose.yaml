# Docker Compose file for preview environment and building docker images in pipelines

services:

  # Database service for local development
  database:
    build:
      args:
        NEO4J_VERSION_PINNED: ${NEO4J_VERSION_PINNED:-2026.06.0}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim}
        INCLUDE_DUMMY_STUDIES: ${INCLUDE_DUMMY_STUDIES:-false}
        # The seed build runs Neo4j plus several Python importers. Keep its
        # default footprint below Docker Desktop's common 8 GiB limit; release
        # builders with more memory may raise these explicitly.
        NEO4J_server_memory_heap_initial__size: "${NEO4J_BUILD_HEAP_INITIAL:-1G}"
        NEO4J_server_memory_heap_max__size: "${NEO4J_BUILD_HEAP_MAX:-3G}"
        NEO4J_server_memory_pagecache_size: "${NEO4J_BUILD_PAGECACHE:-1G}"
        CDISC_DATA_DIR: ${CDISC_DATA_DIR:-mdr_standards_import/container_booting/}
        # Seed with a build-only credential. The production database backup does
        # not contain the system auth database; runtime auth is set below.
        NEO4J_MDR_AUTH_PASSWORD: "build-only-not-runtime"
        UID: ${UID:-1000}
      context: ./
      dockerfile: database.Dockerfile
    image: ${DATABASE_IMAGE:-}
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme1234}"
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_default__advertised__address: "localhost"
      NEO4J_server_bolt_advertised__address: "localhost:5002"
      NEO4J_server_http_advertised__address: "localhost:5001"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEO4J_BOLT_PORT:-5002}:7687"
      - "${BIND_ADDRESS:-127.0.0.1}:${NEO4J_HTTP_PORT:-5001}:7474"
    volumes:
      - type: volume
        source: data
        target: /data
      # For database dumps, you can mount a folder into the container ex.:
      #- ./neo4j-dumps:/data/dumps

  # API image & service, distinct build stages for production and development
  api:
    build:
      context: ./clinical-mdr-api
      dockerfile: Dockerfile
      args:
        TARGET: ${BUILD_TARGET:-dev}
    image: ${API_IMAGE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Use an OSB-specific host override. A generic host NEO4J_DSN commonly
      # points at localhost:<published-port>; inside this container localhost is
      # the API itself, which produced a falsely-healthy stack with every study
      # endpoint returning 500. The default is Docker DNS + the container port.
      NEO4J_DSN: "${OSB_NEO4J_DSN:-bolt://neo4j:changeme1234@database:7687/mdrdb}"
      ALLOW_ORIGIN_REGEX: '${ALLOW_ORIGIN_REGEX:-^https?://(osb\.)?(localhost|127\.0\.0\.1)(:[0-9]+)?$}'
      # Command Center is the interactive broker. OSB validates its short-lived
      # RS256 assertion and persists only a local user projection for authorship.
      # Local preview defaults must be self-contained: Command Center is not part
      # of this compose project, and consumer/extensions currently fail startup
      # when discovery is unreachable. Production sets both True explicitly via
      # .env.production.example.
      OAUTH_ENABLED: "${OSB_API_AUTH_ENABLED:-False}"
      OAUTH_RBAC_ENABLED: "${OSB_API_RBAC_ENABLED:-False}"
      OAUTH_METADATA_URL: "${COMMAND_CENTER_METADATA_URL:-http://host.docker.internal:7000/.well-known/openid-configuration}"
      OAUTH_API_APP_ID: "${COMMAND_CENTER_OSB_AUDIENCE:-accuratrial-openstudybuilder}"
      OAUTH_API_APP_SECRET: "${OAUTH_API_APP_SECRET:-}"
      OAUTH_SWAGGER_APP_ID: "${OAUTH_SWAGGER_APP_ID:-}"
      MS_GRAPH_INTEGRATION_ENABLED: "${MS_GRAPH_INTEGRATION_ENABLED:-}"
      MS_GRAPH_GROUPS_QUERY: "${MS_GRAPH_GROUPS_QUERY:-}"
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      # AccuraTrial EDC push (/integrations/edc); empty = push disabled.
      EDC_BASE_URL: "${EDC_BASE_URL:-}"
      EDC_API_KEY: "${EDC_API_KEY:-}"
      # Safe transition: carrier-compatible V1 exports are explicitly shadow
      # artifacts. Set to enforced only when the native released-version package
      # is enabled; enforced mode refuses the legacy source-overlay exporter.
      MAPPING_AUTHORITY_MODE: "${MAPPING_AUTHORITY_MODE:-shadow}"
      ALLOW_UNSAFE_LEGACY_EDC_SEND: "${ALLOW_UNSAFE_LEGACY_EDC_SEND:-false}"

      # Platform control plane (governed candidate round-trip). Both default OFF
      # so an ordinary local preview is unchanged; the router is mounted either
      # way and every handler refuses 503 OSB_PLATFORM_COMMANDS_DISABLED until
      # the flag is on. They live here rather than in an ad-hoc `docker run`
      # override because the flag alone is not enough to serve a command: the
      # candidate-set handler verifies the CSL request signature through the
      # development signing gateway, and `_platform_principal` needs a Command
      # Center assertion carrying purpose=workflow-orchestration plus
      # candidate:generate, which means OSB_API_AUTH_ENABLED=True as well.
      OSB_PLATFORM_COMMANDS_PROTOTYPE_ENABLED: "${OSB_PLATFORM_COMMANDS_PROTOTYPE_ENABLED:-False}"
      OSB_CANDIDATE_REQUEST_SIGNATURE_VERIFICATION_URL: "${OSB_CANDIDATE_REQUEST_SIGNATURE_VERIFICATION_URL:-}"

      UVICORN_PORT: 5003
      UVICORN_ROOT_PATH: "/api"
      # deprecated #
      OAUTH_APP_ID: "${OAUTH_APP_ID:-}"
      OAUTH_APP_SECRET: "${OAUTH_APP_SECRET:-}"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID:-}"
      OIDC_METADATA_DOCUMENT: "${OIDC_METADATA_DOCUMENT:-}"

  # Consumer API image & service
  consumerapi:
    build:
      context: ./clinical-mdr-api
      dockerfile: Dockerfile
      args:
        TARGET: ${BUILD_TARGET:-dev}
    image: ${API_IMAGE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
    environment:
      NEO4J_DSN: "${OSB_NEO4J_DSN:-bolt://neo4j:changeme1234@database:7687/mdrdb}"
      ALLOW_ORIGIN_REGEX: '${ALLOW_ORIGIN_REGEX:-^https?://(osb\.)?(localhost|127\.0\.0\.1)(:[0-9]+)?$}'
      OAUTH_ENABLED: "${OSB_API_AUTH_ENABLED:-False}"
      OAUTH_RBAC_ENABLED: "${OSB_API_RBAC_ENABLED:-False}"
      OAUTH_METADATA_URL: "${COMMAND_CENTER_METADATA_URL:-http://host.docker.internal:7000/.well-known/openid-configuration}"
      OAUTH_API_APP_ID: "${COMMAND_CENTER_OSB_AUDIENCE:-accuratrial-openstudybuilder}"
      OAUTH_SWAGGER_APP_ID: "${OAUTH_SWAGGER_APP_ID:-}"
      UVICORN_PORT: 5008
      UVICORN_ROOT_PATH: "/consumer-api"
      UVICORN_APP: consumer_api.consumer_api:app

  # Extensions API image & service
  extensionsapi:
    build:
      context: ./clinical-mdr-api
      dockerfile: Dockerfile
      args:
        TARGET: ${BUILD_TARGET:-dev}
    image: ${API_IMAGE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
    environment:
      NEO4J_DSN: "${OSB_NEO4J_DSN:-bolt://neo4j:changeme1234@database:7687/mdrdb}"
      ALLOW_ORIGIN_REGEX: '${ALLOW_ORIGIN_REGEX:-^https?://(osb\.)?(localhost|127\.0\.0\.1)(:[0-9]+)?$}'
      OAUTH_ENABLED: "${OSB_API_AUTH_ENABLED:-False}"
      OAUTH_RBAC_ENABLED: "${OSB_API_RBAC_ENABLED:-False}"
      OAUTH_METADATA_URL: "${COMMAND_CENTER_METADATA_URL:-http://host.docker.internal:7000/.well-known/openid-configuration}"
      OAUTH_API_APP_ID: "${COMMAND_CENTER_OSB_AUDIENCE:-accuratrial-openstudybuilder}"
      OAUTH_SWAGGER_APP_ID: "${OAUTH_SWAGGER_APP_ID:-}"
      UVICORN_PORT: 5009
      UVICORN_ROOT_PATH: "/extensions-api"
      UVICORN_APP: extensions.extensions_api:app

  # Frontend image for production (see UI service for local development)
  frontend:
    build:
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
      context: ./studybuilder
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # Nginx reverse-proxy configuration requires downstream services to be ready at startup
      api:
        condition: service_healthy
      documentation:
        condition: service_healthy
      neodash:
        condition: service_healthy
      consumerapi:
        condition: service_healthy
      extensionsapi:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5005}:5005"
    environment:
      API_BASE_URL: "${API_PATH:-}"
      DOC_BASE_URL: "${DOC_PATH:-}"
      NEODASH_BASE_URL: "${NEODASH_PATH:-}"
      # The gateway already established the user session. Keep the Vue OAuth UI
      # off so it never prompts for a second interactive login.
      OAUTH_ENABLED: "${OSB_UI_OAUTH_ENABLED:-false}"
      OAUTH_METADATA_URL: "${COMMAND_CENTER_METADATA_URL:-http://host.docker.internal:7000/.well-known/openid-configuration}"
      OAUTH_API_APP_ID: "${COMMAND_CENTER_OSB_AUDIENCE:-accuratrial-openstudybuilder}"
      OAUTH_UI_APP_ID: "${OAUTH_UI_APP_ID:-}"
      APPINSIGHTS_DISABLE: "true"

  # Documentation portal image for production (see docs service for local development)
  documentation:
    build:
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
      context: ./documentation-portal
      dockerfile: Dockerfile
    image: ${DOCUMENTATION_IMAGE:-}

  # Neodash service used with defined parameters
  neodash:
    image: ${NEODASH_IMAGE:-}
    build:
      context: ./osb-neodash
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NEODASH_PORT:-5007}:5007"
    environment:
      - NGINX_PORT=5007
      - ssoEnabled=false
      - ssoDiscoveryUrl=https://localhost.com
      - standalone=true
      - standaloneProtocol=neo4j
      - standaloneHost=localhost
      - standalonePort=5002
      - standaloneDatabase=mdrdb
      - standaloneAllowLoad=true
      - standaloneDashboardName=Activity Library Dashboard
      - standaloneDashboardDatabase=mdrdb
      - standaloneUsername=neo4j
      - standalonePassword=${NEO4J_PASSWORD:-changeme1234}


volumes:
  # Volume for storing the database on a local development environment
  data:
    name: studybuilder_database
